syntax = "proto3";

package sparrowx.agentic;

option java_package = "com.sparrowx.agentic.contracts";
option java_multiple_files = true;
option java_outer_classname = "AgenticProto";


service AgenticService {

  // Executes a single agentic mission and returns the
  // synthesized final answer.
  rpc Execute (AgenticRequest) returns (AgenticResponse);
}

// =======================================================
// Messages
// =======================================================

message AgenticRequest {

  string user_id = 1;

  string prompt = 2;

  // map<string, string> context = 3;
  // int32 max_tokens = 4;
  // double temperature = 5;
}

message AgenticResponse {

  string output = 1;

  bool success = 2;

  string error = 3;

  // int32 tokens_used = 4;
}
