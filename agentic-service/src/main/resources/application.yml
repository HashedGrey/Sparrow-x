spring:
  application:
    name: agentic-service
  profiles:
    active: dev
  main:
    allow-circular-references: false
  mvc:
    problemdetails:
      enabled: true
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:50056}
#  flyway:
#    #enabled: true
#    locations: classpath:db/migration
#    baseline-on-migrate: true
#    baseline-version: 0
#    validate-on-migrate: true
#    clean-disabled: true
  jpa:
    entity-packages-to-scan: com.sparrowx.agentic.data.postgres.entities
    properties:
      hibernate:
        column_ordering_strategy: legacy
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        format_sql: false
    show-sql: false

server:
  port: ${SERVER_PORT:8086}

embabel:
  models:
    default-llm: gemini-2.5-flash

  agent:
    platform:
      scanning:
        annotation: true
        bean: false
      llm-operations:
        data-binding:
          max-attempts: 1
      models:
        gemini:
          api-key: ${GEMINI_API_KEY}
          max-attempts: 1
      observability:
        enabled: true
        tracing-enabled: true
        metrics-enabled: true

        service-name: agentic-service
        max-attribute-length: 16000

        trace-agent: true
        trace-action: true
        trace-llm-calls: true
        trace-tool-calls: true
        trace-tool-loop: true
        trace-planning: true
        trace-state-transitions: true
        trace-lifecycle-states: true
        trace-rag: true

        # Start false for SparrowX because prompts/doc content
        # can contain internal enterprise data.
        capture-message-content: false

sparrowx:
  # Compatibility alias for TemporalMissionClient in the supplied source.
  # Both client and worker resolve to the same physical queue.
  temporal:
    mission-task-queue: ${TEMPORAL_TASK_QUEUE:agentic-mission-task-queue}
  agentic:
    temporal:
      endpoint: ${TEMPORAL_ENDPOINT:localhost:7233}
      namespace: ${TEMPORAL_NAMESPACE:default}
      task-queue: ${TEMPORAL_TASK_QUEUE:agentic-mission-task-queue}
      worker-enabled: ${TEMPORAL_WORKER_ENABLED:true}
      worker:
        max-concurrent-workflow-tasks: 100
        max-concurrent-activities: 50
    downstream:
      internal:
        host: ${INTERNAL_GRPC_HOST:localhost}
        port: ${INTERNAL_GRPC_PORT:50055}
        plaintext: ${INTERNAL_GRPC_PLAINTEXT:true}
        max-inbound-message-bytes: 16777216
      document:
        host: ${DOCUMENT_GRPC_HOST:localhost}
        port: ${DOCUMENT_GRPC_PORT:50054}
        plaintext: ${DOCUMENT_GRPC_PLAINTEXT:true}
        max-inbound-message-bytes: 16777216

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      service: agentic-service
  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  file:
    name: logs/agentic-service.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7