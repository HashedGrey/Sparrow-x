global:
  scrape_interval: 10s

scrape_configs:

  - job_name: "api-gateway-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8080" ]


  - job_name: "document-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:8081" ]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]