
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    typeName: Prometheus
    uid: prometheus-uid
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    readOnly: false
    user: ''
    database: ''
    version: 1
    editable: false
    jsonData:
      httpMethod: GET


  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
    apiVersion: 1
    uid: tempo-uid
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus-uid
      streamingEnabled:
        search: true
        hide: false
      tracesToLogs:
        datasourceUid: loki-uid
        tags: [ "service.name" ]
        mappedTags:
          - key: service.name
            value: service
        mapTagNamesEnabled: true


  - name: Loki
    type: loki
    access: proxy
    uid: loki-uid
    url: http://loki:3100
    user: ''
    database: ''
    readOnly: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo-uid
          matcherRegex: "trace=([a-f0-9]+)"
          name: traceID
          url: '$${__value.raw}'
          urlDisplayLabel: "View Trace"


  - name: Kibana 
    type: elasticsearch
    url: http://elasticsearch:9200
    access: proxy
    isDefault: false
    uid: kibana-uid
    jsonData:
      esVersion: 7
      timeField: "@timestamp"
      maxConcurrentShardRequests: 256
      interval: Daily
      logMessageField: "message" # Optional: Field for log messages
      logLevelField: "level" # Optional: Field for log levels
    editable: true     